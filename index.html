<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فهرست وسایل مدرسه</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f3f5f7;
    margin:0;
    padding:30px 15px;
    color:#333;
}

header {
    text-align:center;
    background:white;
    max-width:760px;
    margin:0 auto 35px;
    padding:30px 15px;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

h1 {
    font-size:30px;
    color:#263238;
    margin:0 0 10px;
}

.subtitle {
    color:#777;
    font-size:17px;
    margin:0;
}

.container {
    max-width:760px;
    margin:auto;
}

.box {
    display:block;
    text-decoration:none;
    color:#263238;
    background:white;
    margin:22px auto;
    padding:28px 25px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    text-align:center;
    transition:transform .2s ease, box-shadow .2s ease;
}

.box:hover {
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0,0,0,.16);
}

.icon {
    font-size:42px;
    margin-bottom:10px;
}

.box h2 {
    margin:5px 0 8px;
    font-size:24px;
}

.box p {
    margin:0;
    color:#777;
    font-size:16px;
}

.footer {
    text-align:center;
    color:#888;
    font-size:14px;
    margin:35px 0 15px;
}

@media(max-width:600px) {
    body {
        padding:20px 10px;
    }

    h1 {
        font-size:24px;
    }

    .box h2 {
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📦 فهرست وسایل مدرسه</h1>
    <p class="subtitle">برای مشاهده محتویات هر کارتن، روی آن کلیک کنید</p>
</header>

<main class="container">

    <a class="box" href="carton1/">
        <div class="icon">📦</div>
        <h2>کارتن شماره ۱</h2>
        <p>مشاهده ۱۷ گروه وسیله</p>
    </a>

    <a class="box" href="carton2/">
        <div class="icon">📦</div>
        <h2>کارتن شماره ۲</h2>
        <p>مشاهده ۸ گروه وسیله</p>
    </a>

    <a class="box" href="carton3/">
        <div class="icon">📦</div>
        <h2>کارتن شماره ۳</h2>
        <p>مشاهده ۲ گروه وسیله</p>
    </a>

</main>

<footer class="footer">
    فهرست و تصاویر وسایل مدرسه
</footer>

</body>
</html>
